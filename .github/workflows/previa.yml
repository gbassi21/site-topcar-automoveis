# Monta o site e guarda o resultado no branch "previa", sem publicar no GitHub Pages.
# Serve para conferir o site antes de colocá-lo no ar.
name: Montar prévia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: previa
  cancel-in-progress: true
jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Montar o site
        run: npx @11ty/eleventy --pathprefix="/${{ github.event.repository.name }}/"
      - name: Guardar no branch previa
        run: |
          cd _site
          touch .nojekyll
          git init -q -b previa
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Prévia de ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previa
